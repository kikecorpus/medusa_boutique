<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0812;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-pattern {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(100,40,160,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(140,60,200,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(80,20,120,0.12) 0%, transparent 70%),
      #0d0812;
    z-index: 0;
  }

  .snake-deco {
    position: fixed;
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
  }
  .snake-deco.top-right { top: -40px; right: -40px; width: 320px; }
  .snake-deco.bottom-left { bottom: -60px; left: -60px; width: 280px; transform: rotate(180deg); }

  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 480px;
  }

  .crown {
    width: 36px; height: 36px;
    margin-bottom: 1rem;
    opacity: 0.75;
  }

  .brand { text-align: center; margin-bottom: 0.4rem; }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 10vw, 4.2rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: #d8b8f0;
    line-height: 1;
    text-transform: uppercase;
  }

  .brand-sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.45em;
    color: #8a5aaa;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.6rem 0 2rem;
    width: 100%;
    max-width: 320px;
  }
  .divider-line {
    flex: 1; height: 0.5px;
    background: linear-gradient(to right, transparent, #7a3aaa, transparent);
  }
  .divider-dot { width: 4px; height: 4px; border-radius: 50%; background: #9a5abf; }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: #7a5a9a;
    letter-spacing: 0.04em;
    margin-bottom: 2.4rem;
    text-align: center;
  }

  .cta-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 320px;
  }

  .cta-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.5rem;
    border-radius: 2px;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    position: relative;
    overflow: hidden;
    border: none;
    width: 100%;
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.22s ease;
    background: rgba(255,255,255,0.05);
  }
  .cta-btn:hover::before { opacity: 1; }
  .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(100,40,180,0.35); }
  .cta-btn:active { transform: translateY(0); }

  .btn-whatsapp {
    background: #1a0d2e;
    border: 0.5px solid #5a2a9a;
    color: #c090f0;
  }

  .btn-catalogo {
    background: #23103a;
    border: 0.5px solid #8a4acf;
    color: #e0c0ff;
  }

  .btn-label { display: flex; align-items: center; gap: 10px; }

  .btn-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .btn-arrow {
    font-size: 1rem;
    opacity: 0.45;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  .cta-btn:hover .btn-arrow { transform: translateX(4px); opacity: 0.9; }

  .footer-note {
    margin-top: 2.8rem;
    font-size: 0.58rem;
    letter-spacing: 0.25em;
    color: #3a2a50;
    text-align: center;
    text-transform: uppercase;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  .crown { animation: fadeIn 0.6s ease both, floatUp 3s 0.6s ease-in-out infinite alternate; }
  .brand { animation: fadeIn 0.6s 0.15s ease both; }
  .divider { animation: fadeIn 0.6s 0.3s ease both; }
  .tagline { animation: fadeIn 0.6s 0.4s ease both; }
  .cta-btn:nth-child(1) { animation: fadeIn 0.6s 0.52s ease both; }
  .cta-btn:nth-child(2) { animation: fadeIn 0.6s 0.64s ease both; }
  .footer-note { animation: fadeIn 0.6s 0.76s ease both; }
</style>
</head>
